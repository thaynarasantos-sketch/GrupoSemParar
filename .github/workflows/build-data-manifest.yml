name: Atualizar manifest.json da pasta data/

# Roda toda vez que qualquer arquivo dentro de data/ for enviado/alterado
# (por exemplo, um novo "consumo*.csv"). Gera data/manifest.json com a lista
# de arquivos daquela pasta, para o painel não depender da API do GitHub
# (que tem limite de 60 requisições/hora para usuários anônimos).
on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Gerar data/manifest.json
        run: |
          cd data
          python3 - <<'PY'
          import json, os

          files = sorted(
              f for f in os.listdir(".")
              if f.lower().endswith(".csv") and f.lower() != "manifest.json"
          )
          manifest = [{"name": f} for f in files]
          with open("manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          print("manifest.json gerado com", len(manifest), "arquivo(s):", files)
          PY

      - name: Commitar manifest.json (se mudou)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualizar data/manifest.json [skip ci]"
          file_pattern: "data/manifest.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
